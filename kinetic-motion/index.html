<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENERGY IN MOTION</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; user-select: none; -webkit-user-select: none; }
    .viewport-3d { perspective: 1200px; perspective-origin: 50% 50%; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
    .poster-container { transform-style: preserve-3d; position: relative; width: min(88vw, 88vh); height: min(88vw, 88vh); max-width: 580px; max-height: 580px; background: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 5% 4%; }
    .column-track { transform-style: preserve-3d; position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
    .drum { transform-style: preserve-3d; position: absolute; width: 100%; height: 100%; transition: transform .82s cubic-bezier(.22,.78,.18,1); will-change: transform, filter; }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
    .face-front { transform: rotateX(0deg) translateZ(46px); }
    .face-back { transform: rotateX(180deg) translateZ(46px); }
    /* Counter-rotate the back-face content so letters stay upright and readable. */
    .face-back .letter-glyph { transform: rotateX(180deg); }
    .face-top-rim { position: absolute; width: 100%; height: 92px; top: -46px; left: 0; background: linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.02)); transform: rotateX(90deg); backface-visibility: hidden; pointer-events: none; }
    .face-bottom-rim { position: absolute; width: 100%; height: 92px; bottom: -46px; left: 0; background: linear-gradient(0deg,rgba(255,255,255,.2),rgba(0,0,0,.95)); transform: rotateX(-90deg); backface-visibility: hidden; pointer-events: none; }
    .letter-glyph { font-family: 'Space Grotesk',sans-serif; font-weight: 800; line-height: .85; letter-spacing: -.04em; text-transform: uppercase; font-size: clamp(2.8rem,10vw,5.8rem); color: #fff; text-shadow: 0 4px 18px rgba(255,255,255,.22); }
    .kolorado-dot { width: clamp(10px,1.8vw,15px); height: clamp(10px,1.8vw,15px); background: #fff; display: block; box-shadow: 0 0 6px rgba(255,255,255,.4); }
    .raster-overlay { background: repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0px,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px); pointer-events: none; }
    .spotlight { background: radial-gradient(ellipse 95% 75% at 50% 25%,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 45%,rgba(0,0,0,.98) 85%); }
    @media (prefers-reduced-motion: reduce) { .drum { transition-duration: .01ms !important; } }
  </style>
</head>
<body class="bg-black text-white w-screen h-screen overflow-hidden">
  <main class="viewport-3d">
    <div id="poster-wrapper" class="poster-container">
      <div class="absolute inset-0 spotlight pointer-events-none"></div>
      <div class="absolute inset-0 raster-overlay pointer-events-none"></div>
      <div class="relative z-10 w-full h-full flex flex-col justify-between my-auto py-2">
        <div id="kinetic-drums" class="grid grid-cols-6 gap-0 sm:gap-1 text-center items-center justify-center w-full h-full"></div>
        <div class="absolute inset-y-0 inset-x-0 flex items-center justify-between pointer-events-none px-1">
          <div class="text-left font-sans flex flex-col justify-between h-[clamp(75px,13vw,100px)] select-none">
            <span class="kolorado-dot"></span>
            <div class="space-y-0.5 my-auto pl-0.5">
              <p class="font-bold text-white text-[9px] sm:text-[11px] md:text-[12px] tracking-tight">Kolorado Talk #1</p>
              <p class="text-white/80 text-[8.5px] sm:text-[10px] md:text-[11px]">26. Januar 2023</p>
              <p class="text-white/70 text-[8px] sm:text-[9.5px] md:text-[10.5px]">19:00 Uhr</p>
            </div>
            <span class="kolorado-dot"></span>
          </div>
          <div class="text-center font-black tracking-widest text-white text-3xl sm:text-5xl font-mono drop-shadow-[0_0_14px_rgba(255,255,255,0.4)] px-3 my-auto">IN</div>
          <div class="text-right font-sans flex flex-col justify-between items-end h-[clamp(75px,13vw,100px)] select-none">
            <span class="kolorado-dot"></span>
            <div class="space-y-0.5 my-auto pr-0.5">
              <p class="font-bold text-white text-[9px] sm:text-[11px] md:text-[12px] tracking-tight">Hosted by Karl Anders</p>
              <p class="text-white/80 text-[8.5px] sm:text-[10px] md:text-[11px]">Holstenplatz 20</p>
              <p class="text-white/70 text-[8px] sm:text-[9.5px] md:text-[10.5px]">22765 Hamburg</p>
            </div>
            <span class="kolorado-dot"></span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const word1 = "ENERGY";
    const word2 = "MOTION";
    let currentRotation = 0;
    let drums = [];
    let sequenceTimers = [];
    const drumsGrid = document.getElementById("kinetic-drums");

    function initDrums() {
      drumsGrid.innerHTML = "";
      drumsGrid.style.gridTemplateColumns = "repeat(6,minmax(0,1fr))";
      drums = [];
      for (let i = 0; i < 6; i++) {
        const track = document.createElement("div");
        track.className = "column-track h-48 sm:h-64 lg:h-72 flex items-center justify-center";
        const drum = document.createElement("div");
        drum.className = "drum";
        drum.style.transform = "rotateX(0deg)";
        const front = document.createElement("div");
        front.className = "face face-front";
        front.innerHTML = `<div class="letter-glyph pt-1">${word1[i]}</div><div class="letter-glyph pb-1">${word2[i]}</div>`;
        const back = document.createElement("div");
        back.className = "face face-back";
        back.innerHTML = `<div class="letter-glyph pt-1">${word2[i]}</div><div class="letter-glyph pb-1">${word1[i]}</div>`;
        const topRim = document.createElement("div");
        topRim.className = "face-top-rim";
        const bottomRim = document.createElement("div");
        bottomRim.className = "face-bottom-rim";
        drum.append(front, back, topRim, bottomRim);
        track.appendChild(drum);
        drumsGrid.appendChild(track);
        drums.push(drum);
      }
    }

    // A 180-degree half-turn changes the visible word; each column follows in sequence.
    function executeTwist(duration = .82, staggerMs = 72) {
      currentRotation += 180;
      drums.forEach((drum, index) => {
        window.setTimeout(() => {
          drum.style.transition = `transform ${duration}s cubic-bezier(.22,.78,.18,1)`;
          drum.style.filter = "blur(1.1px)";
          drum.style.transform = `rotateX(${currentRotation}deg)`;
          window.setTimeout(() => { drum.style.filter = "none"; }, duration * 1000);
        }, index * staggerMs);
      });
    }

    function clearSequence() {
      sequenceTimers.forEach(window.clearTimeout);
      sequenceTimers = [];
    }

    function scheduleSequence() {
      clearSequence();
      sequenceTimers.push(window.setTimeout(() => executeTwist(.82,72), 1450));
      sequenceTimers.push(window.setTimeout(() => executeTwist(.82,72), 4700));
      sequenceTimers.push(window.setTimeout(scheduleSequence, 9000));
    }

    document.getElementById("poster-wrapper").addEventListener("click", () => {
      clearSequence();
      executeTwist(.72,48);
      sequenceTimers.push(window.setTimeout(scheduleSequence,6500));
    });

    initDrums();
    scheduleSequence();
  </script>
</body>
</html>
